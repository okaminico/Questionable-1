name: Release

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build with dotnet
        run: dotnet build --configuration Release Questionable/Questionable.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\" -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest
        shell: pwsh
        run: |
          $path = './Questionable/dist/Questionable/Questionable.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Rename artifact to Questionable.zip
        shell: pwsh
        run: |
          # 直接指名輸出路徑，不要用 -Recurse 找 latest.zip：加了 GatheringPathRenderer
          # 之後同一棵樹底下會有兩個 latest.zip，萬用字元搜尋的順序不保證,撿錯一個就會把
          # GatheringPathRenderer 的資產包成 Questionable.zip。
          Copy-Item './Questionable/dist/Questionable/latest.zip' -Destination 'Questionable.zip'
      - name: Build with dotnet (GatheringPathRenderer)
        run: dotnet build --configuration Release GatheringPathRenderer/GatheringPathRenderer.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\" -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest (GatheringPathRenderer)
        shell: pwsh
        run: |
          $path = './GatheringPathRenderer/dist/GatheringPathRenderer/GatheringPathRenderer.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Rename artifact to GatheringPathRenderer.zip
        shell: pwsh
        run: |
          Copy-Item './GatheringPathRenderer/dist/GatheringPathRenderer/latest.zip' -Destination 'GatheringPathRenderer.zip'
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            Questionable.zip
            Questionable/dist/Questionable/Questionable.json
            GatheringPathRenderer.zip
            GatheringPathRenderer/dist/GatheringPathRenderer/GatheringPathRenderer.json
          generate_release_notes: true

