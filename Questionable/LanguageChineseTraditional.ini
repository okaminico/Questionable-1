Whenever automatic questing stops because it is stuck - an unsupported step, a task that failed, or a step that has to be done by hand - TataruPraise is asked to say a line out loud. Does nothing if TataruPraise is not installed.==自動任務因為不支援的步驟、任務執行失敗，或是走到需要親自處理的步驟而停下來時，請 TataruPraise 念一句話出聲提醒。沒有安裝 TataruPraise 的話這個選項不會有任何作用。
