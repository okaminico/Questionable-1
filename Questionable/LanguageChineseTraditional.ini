Automatically refresh quest steps when stuck (WIP see tooltip)==卡住時自動重新整理任務步驟（WIP，詳見提示）
Questionable will automatically refresh a quest step if it appears to be stuck after the configured delay.==若判斷卡住超過設定的延遲秒數，Questionable 會自動重新整理目前的任務步驟。
This helps resume automated quest completion when interruptions occur.==這有助於在發生中斷時，恢復自動化的任務進行。
WIP feature, rather than remove it, this is a warning that it isn't fully complete.==此功能仍在開發中，尚未完全穩定，先保留而非移除，此提示僅作為警示。
Refresh delay (seconds)==重新整理延遲（秒）
Quest steps will refresh automatically after ?? seconds if no progress is made.==若 ?? 秒內沒有任何進度，任務步驟將會自動重新整理。
Teleport to nearest aetheryte after 3 repeated interruptions (WIP see tooltip)==連續中斷重試 3 次後傳送到最近的大水晶（WIP，詳見提示）
If the same step keeps interrupting and retrying 3 times in a row (e.g. an interaction keeps failing), Questionable will teleport to the nearest unlocked large aetheryte in the current zone and replan the route from there, instead of waiting for the delay above.==若同一個步驟連續中斷重試達 3 次（例如某個互動一直失敗），Questionable 會傳送到目前所在區域最近、已解鎖的大水晶，並從那裡重新規劃路線，不會等到上面設定的延遲秒數才處理。
Does nothing while in combat, or if no large aetheryte in the current zone is unlocked.==戰鬥中，或目前區域沒有已解鎖的大水晶時，這個功能不會有任何動作。
Movement stuck grace period (seconds)==移動卡住緩衝秒數
How long the character can move (running-in-place / stuck against geometry, near-zero actual displacement) before Questionable tries something else - jumping, or recalculating the route from the current position. This is separate from the 'stuck quest step' settings above; it reacts within seconds, not the delay set there.==角色移動中（原地跑步／卡在地形上，實際位移接近零）最多能持續多久，Questionable 才會嘗試別的辦法——跳一下，或從目前位置重新規劃路線。這跟上面「卡住的任務步驟」設定是分開的，這個是以秒為單位即時反應，不是用上面設定的延遲秒數。
Lower = looks less suspicious standing/running in place, but reacts to brief, harmless hitches too - can cause more frequent route recalculations. Default 2.5s.==數值越低，站在原地/原地跑步看起來越不明顯，但也會對短暫、無害的小卡頓有反應，可能導致更頻繁的路線重新規劃。預設 2.5 秒。
