As of version xxxx, QST includes a feature where you can click the ! button next to the quest progress buttons to report an issue with the current quest. This message is to notify you that if you choose to make use of this new feature and submit a bug report, QST will automatically capture and upload the following information:==從 xxxx 版本起，QST 新增了一項功能：你可以點擊任務進度按鈕旁的「!」按鈕來回報目前任務的問題。這則訊息是要通知你，如果你選擇使用這項新功能並送出錯誤回報，QST 將會自動擷取並上傳以下資訊：
List of all enabled plugins and their version numbers==所有已啟用外掛及其版本號的清單
The last ten actions taken by QST==QST 執行的最後十個動作
The quest/sequence/step you are on when clicking the button==點擊按鈕當下所在的任務／序列／步驟
Your list of priority quests==你的優先任務清單
A short configurable message from Settings, if set==若有設定，將附上設定中簡短的可自訂訊息
This feature will never send any information to the bug report service unless you click the ! button highlighted in red below. If you would like to opt out of seeing this button, click the orange "Opt Out" button below. Otherwise, click the green "Dismiss" button to hide this warning.==除非你點擊下方以紅色標示的「!」按鈕，否則此功能絕不會傳送任何資訊給錯誤回報服務。如果你想選擇不再顯示此按鈕，請點擊下方橘色的「選擇退出」按鈕。否則，請點擊綠色的「關閉」按鈕以隱藏此警告。
